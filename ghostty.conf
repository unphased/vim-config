# Config generated by Ghostty Config

cursor-color = #00ff00
mouse-hide-while-typing = true
macos-non-native-fullscreen = visible-menu

# Paste the system clipboard at the terminal layer, including inside Herdr.
keybind = shift+insert=paste_from_clipboard

# Move font-size controls from Ctrl to Alt so Ctrl+- can reach tmux.
keybind = ctrl+==unbind
keybind = ctrl++=unbind
keybind = ctrl+-=text:\x1f
keybind = ctrl+0=unbind

# Avoid Ctrl+Backspace collapsing to Ctrl+H in tmux.
keybind = ctrl+backspace=text:\x17

# --- Pane (split) navigation (tmux-style, no-prefix) ---
keybind = performable:ctrl+h=goto_split:left
keybind = performable:ctrl+j=goto_split:down
keybind = performable:ctrl+k=goto_split:up
keybind = performable:ctrl+l=goto_split:right

# Ghostty uses Ctrl+Tab for its own tabs by default. Send its CSI-u encoding
# through so terminal multiplexers can bind the modified key distinctly.
keybind = ctrl+tab=csi:9;5u

# Pass ctrl+pgup/pgdn through to tmux for pane navigation
keybind = performable:ctrl+page_up=previous_tab
keybind = performable:ctrl+page_down=next_tab

# Platform-specific bind selector symlink (machine-local).
config-file = ../../.vim/ghostty.platform.conf
