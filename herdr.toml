onboarding = false
[ui]
agent_panel_sort = "priority"
pane_borders = "always"
window_title = "{workspace} — {tab} — {pane} — {terminal_title}"

status_indicators = "symbols"
[ui.sound]
enabled = true

[keys]
prefix = "ctrl+s"
focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"
resize_pane_left = "alt+h"
resize_pane_down = "alt+j"
resize_pane_up = "alt+k"
resize_pane_right = "alt+l"
zoom = ["prefix+z", "alt+m"]

[[keys.command]]
key = "ctrl+h"
type = "shell"
command = "~/.vim/herdr-focus.sh left"

[[keys.command]]
key = "ctrl+l"
type = "shell"
command = "~/.vim/herdr-focus.sh right"

[[keys.command]]
key = "ctrl+k"
type = "shell"
command = "~/.vim/herdr-focus.sh up"

[[keys.command]]
key = "ctrl+j"
type = "shell"
command = "~/.vim/herdr-focus.sh down"

[ui.toast]
delivery = "system"

[experimental]
pane_history = true

[theme]
name = "catppuccin"
auto_switch = false

[theme.custom]
panel_bg = "reset"
sidebar_bg = "reset"
