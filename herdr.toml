onboarding = false
[ui]
agent_panel_sort = "priority"
window_title = "{workspace} — {tab} — {pane} — {terminal_title}"

status_indicators = "symbols"
[ui.sound]
enabled = true

[keys]
prefix = "ctrl+s"
focus_pane_left = ["prefix+h", "ctrl+h"]
focus_pane_down = ["prefix+j", "ctrl+j"]
focus_pane_up = ["prefix+k", "ctrl+k"]
focus_pane_right = ["prefix+l", "ctrl+l"]
resize_pane_left = "alt+h"
resize_pane_down = "alt+j"
resize_pane_up = "alt+k"
resize_pane_right = "alt+l"
zoom = ["prefix+z", "alt+m"]

[ui.toast]
delivery = "system"

[experimental]
pane_history = true

[theme]
name = "catppuccin"
auto_switch = false
