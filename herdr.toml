onboarding = false
[ui]
agent_panel_sort = "priority"
pane_borders = "always"
window_title = "{workspace} — {tab} — {pane} — {terminal_title}"

status_indicators = "symbols"
[ui.sound]
enabled = true

[keys]
prefix = "ctrl+s"
previous_tab = ["alt+shift+[", "prefix+p"]
next_tab = ["alt+shift+]", "prefix+n"]
focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"
resize_pane_left = "alt+h"
resize_pane_down = "alt+j"
resize_pane_up = "alt+k"
resize_pane_right = "alt+l"
zoom = ["prefix+z", "alt+m"]

[[keys.command]]
key = "ctrl+h"
type = "shell"
command = "~/.vim/herdr-focus.sh left"

[[keys.command]]
key = "ctrl+l"
type = "shell"
command = "~/.vim/herdr-focus.sh right"

[[keys.command]]
key = "ctrl+k"
type = "shell"
command = "~/.vim/herdr-focus.sh up"

[[keys.command]]
key = "ctrl+j"
type = "shell"
command = "~/.vim/herdr-focus.sh down"

# Move the focused pane into a new, focused workspace.
[[keys.command]]
key = "ctrl+shift+w"
type = "shell"
command = "herdr pane move \"$(herdr pane current --current | jq -r '.result.pane.pane_id')\" --new-workspace --focus"

# Separate the focused pane: use a new tab when its tab has siblings, otherwise a new workspace.
[[keys.command]]
key = "prefix+space"
type = "plugin_action"
command = "local.move-pane-new-tab.move-pane-new-tab"
description = "Separate pane"

[[keys.command]]
key = "prefix+i"
type = "popup"
command = "~/.vim/herdr-session-context.sh"
width = "80%"
height = "60%"
description = "Show active pane and agent session information"

[ui.toast]
delivery = "system"

[experimental]
pane_history = true

[theme]
name = "catppuccin"
auto_switch = false

[theme.custom]
panel_bg = "reset"
sidebar_bg = "reset"
