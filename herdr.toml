onboarding = false
[ui]
agent_panel_sort = "priority"
sidebar_width = 36
sidebar_max_width = 36
pane_borders = "always"
# Show Herdr's native agent label when no higher-priority pane title is set.
show_agent_labels_on_pane_borders = true
window_title = "{workspace} — {tab} — {pane} — {terminal_title}"

status_indicators = "symbols"

sidebar_min_width = 36
[ui.sidebar.agents]
row_gap = 0
# Herdr's default agent style uses overlay0 plus DIM, which is nearly invisible.
rows = [
  ["state_icon", { token = "$aghist_relation", fg = "#89dceb", bold = true, dim = false }, "machine", "workspace", "tab"],
  [{ token = "agent", fg = "#aaaaaa", dim = false }],
]

# Pi publishes these $tokens from the session-topic extension.
[ui.sidebar.agents.rows_by_agent]
pi = [
  ["state_icon",
    { token = "$aghist_relation", fg = "#89dceb", bold = true, dim = false },
    { token = "$pi", fg = "#89b4fa", bold = true },
    { token = "workspace", bold = true },
    { token = "$project-different", fg = "#dadada", bold = true},
    { token = "tab", dim = false }
  ],
    
  [{ token = "$topic", fg = "#aaaaaa", bold = true, dim = false }],
  [{ token = "$model", fg = "#89b4fa", dim = false }],
  [
    { token = "$session_cost_low", fg = "#a6e3a1", dim = false },
    { token = "$session_cost_moderate", fg = "#f9e2af", dim = false },
    { token = "$session_cost_high", fg = "#f38ba8", bold = true, dim = false },
    { token = "$context_ok", fg = "#a6e3a1", dim = false },
    { token = "$context_warn", fg = "#f9e2af", bold = true, dim = false },
    { token = "$context_error", fg = "#f38ba8", bold = true, dim = false },
    { token = "$session_tokens_healthy", fg = "#a6e3a1", dim = false },
    { token = "$session_tokens_active", fg = "#89b4fa", dim = false },
    { token = "$session_tokens_warn", fg = "#f9e2af", bold = true, dim = false },
    { token = "$session_tokens_long", fg = "#f38ba8", dim = false },
    { token = "$session_tokens_extreme", fg = "#cba6f7", bold = true, dim = false },
    # Fallback for Pi sessions that have not reloaded the metadata extension yet.
    { token = "$session_tokens", fg = "#cba6f7", dim = false },
  ],
]
claude = [
  ["state_icon", { token = "$aghist_relation", fg = "#89dceb", bold = true, dim = false }, { token = "$claude", fg = "#cba6f7", bold = true }, { token = "workspace", bold = true }, { token = "tab", dim = false }],
  [{ token = "$model", fg = "#cba6f7", dim = false }],
  [
    { token = "$session_cost_low", fg = "#a6e3a1", dim = false },
    { token = "$session_cost_moderate", fg = "#f9e2af", dim = false },
    { token = "$session_cost_high", fg = "#f38ba8", bold = true, dim = false },
    { token = "$context_ok", fg = "#a6e3a1", dim = false },
    { token = "$context_warn", fg = "#f9e2af", bold = true, dim = false },
    { token = "$context_error", fg = "#f38ba8", bold = true, dim = false },
    { token = "$session_tokens_healthy", fg = "#a6e3a1", dim = false },
    { token = "$session_tokens_active", fg = "#89b4fa", dim = false },
    { token = "$session_tokens_warn", fg = "#f9e2af", bold = true, dim = false },
    { token = "$session_tokens_long", fg = "#f38ba8", dim = false },
    { token = "$session_tokens_extreme", fg = "#cba6f7", bold = true, dim = false },
  ],
]

[ui.sidebar.spaces]
row_gap = 0
rows = [
  ["state_icon", { token = "$ctrl_tab_target", fg = "#f9e2af", bold = true }, { token = "$aghist_relation", fg = "#89dceb", bold = true, dim = false }, "workspace"],
  [
    { token = "$cpu_idle", fg = "#686868", dim = false },
    { token = "$cpu_cool", fg = "#89b4fa", dim = false },
    { token = "$cpu_active", fg = "#a6e3a1", dim = false },
    { token = "$cpu_warm", fg = "#f9e2af", bold = true, dim = false },
    { token = "$cpu_hot", fg = "#fab387", bold = true, dim = false },
    { token = "$cpu_very_hot", fg = "#f38ba8", bold = true, dim = false },
    { token = "$memory", fg = "#94e2d5", dim = false },
    "branch",
    "git_status",
  ],
]

[ui.sound]
enabled = true

[keys]
prefix = "ctrl+s"
previous_tab = ""
next_tab = ""
focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"
resize_pane_left = ""
resize_pane_down = ""
resize_pane_up = ""
resize_pane_right = ""
zoom = ["prefix+z", "alt+m", "ctrl+m"]

# Resize from a stable top/left anchor instead of expanding a middle pane in
# both directions. At the bottom/right edge, move the only available boundary.
[[keys.command]]
key = "alt+h"
type = "shell"
command = "~/.vim/herdr-resize.sh left"
description = "Resize pane left (anchored)"

[[keys.command]]
key = "alt+j"
type = "shell"
command = "~/.vim/herdr-resize.sh down"
description = "Resize pane down (anchored)"

[[keys.command]]
key = "alt+k"
type = "shell"
command = "~/.vim/herdr-resize.sh up"
description = "Resize pane up (anchored)"

[[keys.command]]
key = "alt+l"
type = "shell"
command = "~/.vim/herdr-resize.sh right"
description = "Resize pane right (anchored)"

# Shellfish-friendly sidebar sizing: adjustments pin min/max to the same width.
# Toggle restores loose mouse bounds (18..48) or the remembered keyboard width.
# Alt+[ / Alt+] are prefix-free; keep prefix+[ for copy mode and Alt+, / Alt+.
# available to the shell.
[[keys.command]]
key = "prefix+comma"
type = "shell"
command = "~/.vim/herdr-sidebar-resize.sh shrink"
description = "Pin sidebar and narrow by 4"

[[keys.command]]
key = "prefix+period"
type = "shell"
command = "~/.vim/herdr-sidebar-resize.sh grow"
description = "Pin sidebar and widen by 4"

[[keys.command]]
key = "alt+["
type = "shell"
command = "~/.vim/herdr-sidebar-resize.sh shrink"
description = "Pin sidebar and narrow by 4"

[[keys.command]]
key = "alt+]"
type = "shell"
command = "~/.vim/herdr-sidebar-resize.sh grow"
description = "Pin sidebar and widen by 4"

[[keys.command]]
key = "prefix+semicolon"
type = "popup"
command = "~/.vim/herdr-sidebar-resize.sh toggle"
width = "90%"
height = 5
description = "Toggle pinned/mouse sidebar sizing"

# Swap with the workspace carrying the sticky yellow-arrow bookmark.
[[keys.command]]
key = "ctrl+tab"
type = "shell"
command = "~/.vim/herdr-focus.sh toggle"
description = "Toggle bookmarked workspace"

# Move first, then open a 500 ms minimap only for zoomed, multi-pane tabs.
# A Ctrl+H/J/K/L captured by the popup is applied before it closes immediately.
[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "local.pane-navigator.left"
description = "Focus left pane (zoom minimap)"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "local.pane-navigator.right"
description = "Focus right pane (zoom minimap)"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "local.pane-navigator.up"
description = "Focus pane above (zoom minimap)"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "local.pane-navigator.down"
description = "Focus pane below (zoom minimap)"

# Linear tab navigation: cross up/down a workspace only at the tab ends.
# Use the same zoom minimap as pane navigation, including captured repeats.
[[keys.command]]
key = "alt+{"
type = "plugin_action"
command = "local.pane-navigator.previous-tab"
description = "Previous tab (zoom minimap)"

[[keys.command]]
key = "alt+}"
type = "plugin_action"
command = "local.pane-navigator.next-tab"
description = "Next tab (zoom minimap)"

[[keys.command]]
key = "prefix+p"
type = "plugin_action"
command = "local.pane-navigator.previous-tab"
description = "Previous tab (zoom minimap)"

[[keys.command]]
key = "prefix+n"
type = "plugin_action"
command = "local.pane-navigator.next-tab"
description = "Next tab (zoom minimap)"

# Move the focused pane into a new, focused workspace.
[[keys.command]]
key = "ctrl+shift+w"
type = "shell"
command = "herdr pane move \"$(herdr pane current --current | jq -r '.result.pane.pane_id')\" --new-workspace --focus"
description = "Move pane to new workspace"

# Separate the focused pane: use a new tab when its tab has siblings, otherwise a new workspace.
[[keys.command]]
key = "prefix+space"
type = "plugin_action"
command = "local.move-pane-new-tab.move-pane-new-tab"
description = "Separate pane"

[[keys.command]]
key = "prefix+i"
type = "popup"
command = "~/.vim/herdr-session-context.sh"
width = "80%"
height = "60%"
description = "Show active pane and agent session information"

[[keys.command]]
key = "prefix+y"
type = "plugin_action"
command = "local.copy-pane-id.copy-pane-id"
description = "Copy pane ID"

[[keys.command]]
key = "prefix+a"
type = "plugin_action"
command = "local.agent-history.open"
description = "Open agent history beside"

[ui.toast]
delivery = "system"

[experimental]
pane_history = true

[theme]
name = "catppuccin"
auto_switch = false

[theme.custom]
# Let the machine-specific terminal background show through Herdr's chrome.
panel_bg = "reset"
sidebar_bg = "reset"
# Keep focused rows and Navigate-mode selection visibly distinct from the machine bg.
active_row_bg = "#403040"
selection_bg = "#45475a"

# Keep inactive pane borders subdued while giving unfocused tabs more contrast.
overlay0 = "#686868"
overlay1 = "#f8b8a8"
surface0 = "#aaaaaa"
accent = "#88b830"
