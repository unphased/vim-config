onboarding = false
[ui]
agent_panel_sort = "priority"
window_title = "{workspace} — {tab} — {pane} — {terminal_title}"

status_indicators = "symbols"
[ui.sound]
enabled = true

[keys]
prefix = "ctrl+s"
focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"
resize_pane_left = "alt+h"
resize_pane_down = "alt+j"
resize_pane_up = "alt+k"
resize_pane_right = "alt+l"
zoom = ["prefix+z", "alt+m"]

[[keys.command]]
key = "ctrl+h"
type = "shell"
command = """
context=$(herdr pane current --current) || exit
pane=$(printf '%s' "$context" | jq -r '.result.pane.pane_id')
tab=$(printf '%s' "$context" | jq -r '.result.pane.tab_id')
workspace=$(printf '%s' "$context" | jq -r '.result.pane.workspace_id')
edges=$(herdr pane edges --pane "$pane") || exit
if [ "$(printf '%s' "$edges" | jq -r '.result.edges.left')" = true ]; then
  tabs=$(herdr tab list --workspace "$workspace") || exit
  current=$(printf '%s' "$tabs" | jq -r --arg id "$tab" '.result.tabs[] | select(.tab_id == $id) | .number')
  target=$(printf '%s' "$tabs" | jq -r --argjson n "$((current - 1))" '.result.tabs[] | select(.number == $n) | .tab_id')
  if [ -n "$target" ]; then
    herdr tab focus "$target"
  fi
else
  herdr pane focus --pane "$pane" --direction left
fi
"""

[[keys.command]]
key = "ctrl+l"
type = "shell"
command = """
context=$(herdr pane current --current) || exit
pane=$(printf '%s' "$context" | jq -r '.result.pane.pane_id')
tab=$(printf '%s' "$context" | jq -r '.result.pane.tab_id')
workspace=$(printf '%s' "$context" | jq -r '.result.pane.workspace_id')
edges=$(herdr pane edges --pane "$pane") || exit
if [ "$(printf '%s' "$edges" | jq -r '.result.edges.right')" = true ]; then
  tabs=$(herdr tab list --workspace "$workspace") || exit
  current=$(printf '%s' "$tabs" | jq -r --arg id "$tab" '.result.tabs[] | select(.tab_id == $id) | .number')
  target=$(printf '%s' "$tabs" | jq -r --argjson n "$((current + 1))" '.result.tabs[] | select(.number == $n) | .tab_id')
  if [ -n "$target" ]; then
    herdr tab focus "$target"
  fi
else
  herdr pane focus --pane "$pane" --direction right
fi
"""

