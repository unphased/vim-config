[package]
name = "jpg-preview"
version = "0.1.0"
edition = "2021"
rust-version = "1.93"

[dependencies]
base64 = "=0.22.1"
fast_image_resize = "=5.1.4"
flate2 = { version = "=1.1.2", default-features = false, features = ["rust_backend"] }
image = { version = "=0.25.8", default-features = false, features = ["jpeg", "png"] }
libc = "=0.2.175"
