id = "local.copy-pane-id"
name = "Local Pane Actions"
version = "0.2.0"
min_herdr_version = "0.9.0"
description = "Local actions for Herdr panes"
platforms = ["linux", "macos", "windows"]

[[actions]]
id = "copy-pane-id"
title = "Copy pane ID"
description = "Copy this pane's public Herdr ID to the attached client's clipboard"
contexts = ["pane"]
platforms = ["linux", "macos"]
command = ["sh", "copy-pane-id.sh"]

[[actions]]
id = "copy-pane-id-windows"
title = "Copy pane ID"
description = "Copy this pane's public Herdr ID to the attached client's clipboard"
contexts = ["pane"]
platforms = ["windows"]
command = ["powershell.exe", "-NoLogo", "-NoProfile", "-File", "copy-pane-id.ps1"]

[[actions]]
id = "move-pane-new-workspace"
title = "Move pane to new workspace"
description = "Move this pane into a new focused workspace"
contexts = ["pane"]
platforms = ["linux", "macos"]
command = ["sh", "move-pane-new-workspace.sh"]

[[actions]]
id = "move-pane-new-workspace-windows"
title = "Move pane to new workspace"
description = "Move this pane into a new focused workspace"
contexts = ["pane"]
platforms = ["windows"]
command = ["powershell.exe", "-NoLogo", "-NoProfile", "-File", "move-pane-new-workspace.ps1"]

[[panes]]
id = "osc52"
title = "Copy pane ID"
placement = "tab"
platforms = ["linux", "macos"]
command = ["sh", "copy-pane-id.sh"]

[[panes]]
id = "osc52-windows"
title = "Copy pane ID"
placement = "tab"
platforms = ["windows"]
command = ["powershell.exe", "-NoLogo", "-NoProfile", "-File", "copy-pane-id.ps1"]
